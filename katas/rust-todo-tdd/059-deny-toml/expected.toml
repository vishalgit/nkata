[advisories]
version = 2

[licenses]
version = 2
# Licences you accept. If `cargo deny check` names another one you are happy with, add it here.
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CDLA-Permissive-2.0", "BSL-1.0",
]
private = { ignore = true }      # our own crates are publish = false

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
