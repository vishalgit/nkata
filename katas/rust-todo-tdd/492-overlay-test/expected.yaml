namespace: todo-test
resources:
  - ../../base
patches:
  - target: { kind: Deployment, name: todo }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Ingress, name: todo }
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: test.todo.localhost
